[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cameras-beam-profilers"
version = "0.2.0"
description = "Snapshot-oriented camera wrappers for the yb2 lab: Allied Vision (vmbpy) and Cinogy CinCam (uc480 / uEye), plus a live viewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "vmbpy~=1.2",      # Allied Vision; installs everywhere, finds cameras only with Vimba X
    "numpy~=2.2",
    "matplotlib~=3.10",
]

[project.optional-dependencies]
live = [               # camera_live_view
    "pyqtgraph>=0.13",
    "PySide6-Essentials>=6.5",
]
ueye = [               # cinogy.CinCamCMOS1201 (CinCam through the CINOGY / RayCi driver)
    "pyueye~=4.96",
]

[project.urls]
Repository = "https://github.com/UCBoulder/cameras-beam-profilers"

[tool.setuptools]
packages = ["allied_vision", "cinogy", "cinogy_uc480", "camera_live_view"]
